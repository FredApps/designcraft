name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@09f920c3f494642ec47a98cc19eee671027ff74f
    with:
      app-name: designcraft
      app-dir: DesignCraft
      install-relative-path: Programs/ArtCraft/DesignCraft
      install-scope: perUser
