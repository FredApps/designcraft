name: Design corrected color and core pin validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-core-pin-6a73fda9
  cancel-in-progress: false
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Preserve committed line endings
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout reviewed exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dotCooCoo/designcraft
          ref: 6a73fda99165018098dd033185a5e37c1f794118
          persist-credentials: false
      - name: Verify source and toolchain
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6a73fda99165018098dd033185a5e37c1f794118
          echo 'e4a7b606deef9fd5c0c488e2204fb5369788ed462d51c235d17d3ae31de2fdac  Cargo.lock' | sha256sum -c -
          test -z "$(git status --porcelain)"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          echo 'Exploratory scoped core checks. Prior equivalent Windows run completed in 17m18s; 20-minute per-job cap. Not full workspace, UI/engine/IDML/PDF/render or WASM certification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Core package formatting
        run: cargo +1.95.0 fmt -p designcraft-images -p designcraft-color -p designcraft-format -p xtask -- --check
      - name: PDF dependency pin rules
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: cargo +1.95.0 run --locked -p xtask -- pdf-deps
      - name: Core unfiltered tests and doctests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: cargo +1.95.0 test --locked -p designcraft-images -p designcraft-color -p designcraft-format --no-fail-fast
      - name: Core all-target lint
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: cargo +1.95.0 clippy --locked -p designcraft-images -p designcraft-color -p designcraft-format --all-targets -- -D warnings
      - name: Verify unchanged source and lock
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'e4a7b606deef9fd5c0c488e2204fb5369788ed462d51c235d17d3ae31de2fdac  Cargo.lock' | sha256sum -c -
          test -z "$(git status --porcelain)"
