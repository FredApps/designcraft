name: Packaging lint
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@2b3fb9dc05036f73c77d18f753a3aa9da55fa386
  windows-install-policy:
    timeout-minutes: 10
    name: Windows installation policy (no app build)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install the pinned packaging toolchain
      shell: pwsh
      run: "$tools = Join-Path $env:RUNNER_TEMP 'craft-install-policy-wix'\ndotnet tool install --tool-path $tools wix --version 5.0.2\nif ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }\n$tools >> $env:GITHUB_PATH\n$policy = Get-Content -Raw -LiteralPath packaging/windows/install-policy.json | ConvertFrom-Json\nforeach ($extension in @($policy.extensions)) {\n  & (Join-Path $tools 'wix.exe') extension add -g \"WixToolset.$extension.wixext/5.0.2\"\n  if ($LASTEXITCODE -ne 0) { throw \"WiX extension $extension installation failed.\" }\n}\n"
    - name: Build and check non-executable installer fixtures
      shell: pwsh
      run: ./packaging/windows/test-install-policy.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'craft-install-policy-tests')
