name: Design shared BMP adapter Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-bmp-adapter-265220f7
  cancel-in-progress: false
jobs:
  images:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Preserve committed line endings
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact reviewed adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FredApps/designcraft
          ref: 265220f7371ee9d798f343cf3cee8337874b5225
          persist-credentials: false
      - name: Verify source and toolchain
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 265220f7371ee9d798f343cf3cee8337874b5225
          echo 'e4a7b606deef9fd5c0c488e2204fb5369788ed462d51c235d17d3ae31de2fdac  Cargo.lock' | sha256sum -c -
          test -z "$(git status --porcelain)"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          echo 'Scoped images adapter checks only, including package tests and doctests. Prior larger Windows core run took 17m18s; 20-minute cap. Not whole-app/workspace/feature-unification certification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Images formatting
        run: cargo +1.95.0 fmt -p designcraft-images -- --check
      - name: Unfiltered images tests and doctests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: cargo +1.95.0 test --locked -p designcraft-images --no-fail-fast
      - name: Images all-target lint
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: cargo +1.95.0 clippy --locked -p designcraft-images --all-targets -- -D warnings
      - name: Verify unchanged source and lock
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'e4a7b606deef9fd5c0c488e2204fb5369788ed462d51c235d17d3ae31de2fdac  Cargo.lock' | sha256sum -c -
          test -z "$(git status --porcelain)"
