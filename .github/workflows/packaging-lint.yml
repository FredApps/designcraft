name: Design shared-pin lock generation (no build)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-bmp-lock-c4507ad3
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FredApps/designcraft
          ref: c4507ad3e6b2db5f8d50656c06eb496bb5231ce8
          persist-credentials: false
      - name: Verify input and install declared toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c4507ad3e6b2db5f8d50656c06eb496bb5231ce8
          test -z "$(git status --porcelain)"
          echo 'Lock resolution only. Input lock is the unmodified contributor lock, not claimed valid for the new manifests. No compile, test or merge readiness is claimed. Cold runtime unknown; 20-minute hard cap.' >> "$GITHUB_STEP_SUMMARY"
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 --version
          sha256sum Cargo.lock > "$RUNNER_TEMP/input-lock.sha256"
      - name: Resolve with Cargo and verify locked metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 metadata --format-version 1 > "$RUNNER_TEMP/metadata.json"
          cargo +1.95.0 metadata --locked --format-version 1 > /dev/null
          test "$(git diff --name-only)" = Cargo.lock
          mkdir -p "$RUNNER_TEMP/design-lock-result"
          cp Cargo.lock "$RUNNER_TEMP/design-lock-result/Cargo.lock"
          cp "$RUNNER_TEMP/input-lock.sha256" "$RUNNER_TEMP/design-lock-result/"
          sha256sum Cargo.lock > "$RUNNER_TEMP/design-lock-result/output-lock.sha256"
          git diff --stat > "$RUNNER_TEMP/design-lock-result/diff-stat.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/design-lock-result/source-sha.txt"
          cat "$RUNNER_TEMP/design-lock-result/output-lock.sha256"
      - name: Upload generated lock and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-lock-c4507ad3
          path: ${{ runner.temp }}/design-lock-result
          if-no-files-found: error
          retention-days: 7
